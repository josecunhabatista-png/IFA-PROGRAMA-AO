<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação Acessível</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-container">
    <h1>Apresentação do Projeto</h1>
    <button id="btn-audio" aria-label="Ouvir texto da página em áudio" onclick="lerPagina()">
      🔊 Ouvir Apresentação
    </button>
  </header>

  <main id="conteudo-principal">
    <section class="intro-section" tabindex="0">
      <h2>Visão Geral</h2>
      <p>
        Bem-vindo à nossa apresentação. Este modelo utiliza cores neutras com alto contraste,
        fontes legíveis e estrutura otimizada para tecnologias assistivas.
      </p>
    </section>

    <section class="galeria-section" aria-label="Galeria de Mídias da Apresentação">
      
      <article class="card-midia">
        <figure>
          <img src="https://via.placeholder.com/600x400" alt="Descrição detalhada da Foto 1 para leitores de tela">
          <figcaption><strong>Mídia 1:</strong> Legenda explicativa sobre o conteúdo da primeira foto.</figcaption>
        </figure>
      </article>

      <article class="card-midia">
        <figure>
          <img src="https://via.placeholder.com/600x400" alt="Descrição detalhada da Foto 2 para leitores de tela">
          <figcaption><strong>Mídia 2:</strong> Legenda explicativa sobre o conteúdo da segunda foto.</figcaption>
        </figure>
      </article>

      <article class="card-midia">
        <figure>
          <img src="https://via.placeholder.com/600x400" alt="Descrição detalhada da Foto ou Vídeo 3 para leitores de tela">
          <figcaption><strong>Mídia 3:</strong> Legenda explicativa do terceiro elemento audiovisual.</figcaption>
        </figure>
      </article>

      <article class="card-midia">
        <figure>
          <img src="https://via.placeholder.com/600x400" alt="Descrição detalhada da Foto ou Vídeo 4 para leitores de tela">
          <figcaption><strong>Mídia 4:</strong> Legenda explicativa do quarto elemento audiovisual.</figcaption>
        </figure>
      </article>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Apresentação Acessível</p>
  </footer>

  <script>
    function lerPagina() {
      if ('speechSynthesis' in window) {
        const texto = document.getElementById('conteudo-principal').innerText;
        const synth = window.speechSynthesis;
        
        if (synth.speaking) {
          synth.cancel(); // Para a leitura se o botão for clicado novamente
          return;
        }

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        synth.speak(utterance);
      } else {
        alert('O seu navegador não suporta a funcionalidade de leitura por áudio.');
      }
    }
  </script>
</body>
</html>
