<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Mídia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Minha Galeria de Fotos e Vídeos</h1>
    </header>

    <main class="gallery-container">
        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Descrição da Imagem 1">
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Descrição da Imagem 2">
        </div>

        <div class="gallery-item">
            <video controls poster="https://via.placeholder.com/600x400">
                <source src="seu-video1.mp4" type="video/mp4">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Descrição da Imagem 4">
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Descrição da Imagem 5">
        </div>

        <div class="gallery-item">
            <video controls poster="https://via.placeholder.com/600x400">
                <source src="seu-video2.mp4" type="video/mp4">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        </div>
    </main>

</body>
</html>
